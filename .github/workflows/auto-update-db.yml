name: Daily Phone Database Updater

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 12:00 AM UTC daily
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run Auto-Updater Script
      run: python scrape_latest_phones.py

    - name: Commit and Push Database Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add phones.js
        if git diff --staged --quiet; then
          echo "No database updates found today."
        else
          git commit -m "Auto-updater: Sync latest phone releases from tech news RSS"
          git push
        fi
